name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.19'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint code
        run: npm run lint
      
      - name: Build app
        run: npm run build
      
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 5

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup database
        run: npm run setup
      
      - name: Run tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          # Preferred: RENDER_DEPLOY_HOOK_URL (Render → Service → Settings → Deploy Hook).
          # Fallback: build the hook URL from RENDER_SERVICE_ID + RENDER_DEPLOY_KEY.
          HOOK="$RENDER_DEPLOY_HOOK_URL"
          if [ -z "$HOOK" ] && [ -n "$RENDER_SERVICE_ID" ] && [ -n "$RENDER_DEPLOY_KEY" ]; then
            HOOK="https://api.render.com/deploy/srv-${RENDER_SERVICE_ID#srv-}?key=${RENDER_DEPLOY_KEY}"
          fi
          if [ -z "$HOOK" ]; then
            echo "::warning::Render deploy hook not configured (RENDER_DEPLOY_HOOK_URL). Skipping deployment."
            exit 0
          fi

          echo "🚀 Triggering Render deployment..."
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "✅ Deployment triggered successfully"

      - name: Verify deployment health
        run: |
          echo "⏳ Waiting for deployment to stabilize (30 seconds)..."
          sleep 30
          
          echo "🔍 Checking app health..."
          HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" https://fabulousgemsparlor-store.onrender.com/auth/shopify/callback 2>/dev/null || echo "000")
          
          if [ "$HEALTH_CHECK" = "200" ] || [ "$HEALTH_CHECK" = "301" ] || [ "$HEALTH_CHECK" = "302" ]; then
            echo "✅ App is responding correctly (HTTP $HEALTH_CHECK)"
          else
            echo "⚠️  App health check returned HTTP $HEALTH_CHECK (may still be starting up)"
          fi

  notify:
    runs-on: ubuntu-latest
    needs: [build, test, deploy]
    if: always()
    
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Pipeline completed successfully!"
            echo "🌐 App: https://fabulousgemsparlor-store.onrender.com"
            echo "📊 Dashboard ready to use"
          elif [ "${{ needs.deploy.result }}" = "skipped" ]; then
            echo "⏭️  Deployment skipped (secrets not configured)"
            echo "📖 To enable auto-deploy, add RENDER_DEPLOY_KEY and RENDER_SERVICE_ID to GitHub secrets"
          else
            echo "❌ Pipeline encountered issues"
          fi
