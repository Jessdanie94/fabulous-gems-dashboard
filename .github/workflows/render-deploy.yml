name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: |
          curl https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_DEPLOY_KEY }}
        if: ${{ secrets.RENDER_SERVICE_ID && secrets.RENDER_DEPLOY_KEY }}
      
      - name: Deployment Notice
        run: echo "Deploy webhook triggered for Render service"
