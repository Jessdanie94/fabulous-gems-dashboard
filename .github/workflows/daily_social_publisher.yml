name: Daily Social Product Publisher

on:
  schedule:
    # Runs once every 24 hours at 14:00 UTC (8:00 AM CST)
    - cron: "0 14 * * *"
  workflow_dispatch: # Allows manual 1-click runs from the GitHub Actions tab

permissions:
  contents: read

jobs:
  publish-new-products:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install feedparser requests

      - name: Run auto_social_publisher.py
        env:
          STORE_RSS_URL: ${{ secrets.STORE_RSS_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python auto_social_publisher.py
