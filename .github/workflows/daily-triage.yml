name: Daily Triage

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Summarize new issues
        uses: actions/github-script@v7
        with:
          script: |
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);

            const { data: issues } = await github.rest.issues.listForRepo( {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              since: yesterday.toISOString(),
              per_page: 50
            });

            if (issues.length === 0) {
              console.log('No new issues in the last 24 hours.');
              return;
            }

            const lines = issues.map(i =>
              `#${i.umber}: ${i.title} (opened by @${i.user.login})`
            ).join('\n');

            const today = new Date().toISOString().slice(0, 10);

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `\uD83D\uDC1B Daily Triage ― ${today}`,
              body: `## New & Open Issues (${issues.length})\n\n${lines}\n\n> _Auto-generated by Daily Triage workflow at 09:00 UTC_`,
              labels: ['triage']
            });
            console.log(`Triage summary created for ${issues.length} issues.`);