name: Shopify + Sellvia Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without writing to Shopify
        required: false
        default: true
        type: boolean
      scope:
        description: Sync scope
        required: false
        default: all
        type: choice
        options:
          - all
          - catalog
          - inventory
          - price
          - orders
          - catalog,inventory,price
      enable_writes:
        description: Enable Shopify writes
        required: false
        default: false
        type: boolean
      enable_price_writes:
        description: Enable Shopify price writes
        required: false
        default: false
        type: boolean
      enable_inventory_writes:
        description: Enable Shopify inventory writes
        required: false
        default: false
        type: boolean
      approve_bulk_changes:
        description: Approve bulk or high-risk mutations
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: shopify-sellvia-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
      SHOPIFY_API_TOKEN: ${{ secrets.SHOPIFY_API_TOKEN }}
      SHOPIFY_LOCATION_ID: ${{ secrets.SHOPIFY_LOCATION_ID }}
      SELLVIA_API_KEY: ${{ secrets.SELLVIA_API_KEY }}
      SELLVIA_MASTER_KEY: ${{ secrets.SELLVIA_MASTER_KEY }}
      SELLVIA_API_BASE_URL: ${{ secrets.SELLVIA_API_BASE_URL }}
      SELLVIA_PRODUCTS_URL: ${{ secrets.SELLVIA_PRODUCTS_URL }}
      SELLVIA_INVENTORY_URL: ${{ secrets.SELLVIA_INVENTORY_URL }}
      SELLVIA_PRICES_URL: ${{ secrets.SELLVIA_PRICES_URL }}
      SELLVIA_ORDERS_URL: ${{ secrets.SELLVIA_ORDERS_URL }}
      SYNC_FAILURE_WEBHOOK_URL: ${{ secrets.SYNC_FAILURE_WEBHOOK_URL }}
      SYNC_ARTIFACTS_DIR: artifacts/shopify-sellvia-sync
      SYNC_DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run && 'true' || 'false' }}
      SYNC_SCOPE: ${{ github.event_name == 'schedule' && 'catalog,inventory,price' || inputs.scope || 'all' }}
      SYNC_ENABLE_WRITES: ${{ github.event_name == 'schedule' && 'false' || inputs.enable_writes && 'true' || 'false' }}
      SYNC_ENABLE_PRICE_WRITES: ${{ github.event_name == 'schedule' && 'false' || inputs.enable_price_writes && 'true' || 'false' }}
      SYNC_ENABLE_INVENTORY_WRITES: ${{ github.event_name == 'schedule' && 'false' || inputs.enable_inventory_writes && 'true' || 'false' }}
      SYNC_APPROVE_BULK_CHANGES: ${{ github.event_name == 'schedule' && 'false' || inputs.approve_bulk_changes && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Preflight - validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          check_required () {
            key="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing required configuration: $key"
              missing=1
            else
              echo "::notice::$key is set"
            fi
          }

          check_optional () {
            key="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::notice::Optional configuration not set: $key"
            else
              echo "::notice::$key is set"
            fi
          }

          has_scope () {
            scope_name="$1"
            case ",$SYNC_SCOPE," in
              *",all,"*|*",$scope_name,"*) return 0 ;;
              *) return 1 ;;
            esac
          }

          check_required "SHOPIFY_STORE_DOMAIN" "$SHOPIFY_STORE_DOMAIN"
          check_required "SHOPIFY_ADMIN_ACCESS_TOKEN or SHOPIFY_API_TOKEN" "${SHOPIFY_ADMIN_ACCESS_TOKEN:-$SHOPIFY_API_TOKEN}"
          check_required "SELLVIA_API_KEY or SELLVIA_MASTER_KEY" "${SELLVIA_API_KEY:-$SELLVIA_MASTER_KEY}"
          check_optional "SHOPIFY_LOCATION_ID" "$SHOPIFY_LOCATION_ID"
          check_optional "SELLVIA_API_BASE_URL" "$SELLVIA_API_BASE_URL"

          if has_scope "catalog"; then
            check_required "SELLVIA_PRODUCTS_URL" "$SELLVIA_PRODUCTS_URL"
          else
            check_optional "SELLVIA_PRODUCTS_URL" "$SELLVIA_PRODUCTS_URL"
          fi

          if has_scope "inventory"; then
            check_required "SELLVIA_INVENTORY_URL" "$SELLVIA_INVENTORY_URL"
          else
            check_optional "SELLVIA_INVENTORY_URL" "$SELLVIA_INVENTORY_URL"
          fi

          if has_scope "price"; then
            check_required "SELLVIA_PRICES_URL" "$SELLVIA_PRICES_URL"
          else
            check_optional "SELLVIA_PRICES_URL" "$SELLVIA_PRICES_URL"
          fi

          if has_scope "orders"; then
            check_required "SELLVIA_ORDERS_URL" "$SELLVIA_ORDERS_URL"
          else
            check_optional "SELLVIA_ORDERS_URL" "$SELLVIA_ORDERS_URL"
          fi

          check_optional "SYNC_FAILURE_WEBHOOK_URL" "$SYNC_FAILURE_WEBHOOK_URL"

          if [ "$missing" -ne 0 ]; then
            echo "::error::Preflight failed due to missing required secrets/configuration."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable
          else
            npm install
          fi

      - name: Run Shopify/Sellvia sync
        shell: bash
        run: |
          set -euo pipefail
          npm run sync:shopify-sellvia -- --dry-run "$SYNC_DRY_RUN" --scope "$SYNC_SCOPE"

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$SYNC_ARTIFACTS_DIR/summary.md" ]; then
            cat "$SYNC_ARTIFACTS_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopify-sellvia-sync-artifacts
          path: |
            artifacts/shopify-sellvia-sync/summary.json
            artifacts/shopify-sellvia-sync/details.json
            artifacts/shopify-sellvia-sync/summary.md
          if-no-files-found: warn
          retention-days: 7

      - name: Notify webhook on failure
        if: failure() && env.SYNC_FAILURE_WEBHOOK_URL != ''
        shell: bash
        run: |
          payload_file="$SYNC_ARTIFACTS_DIR/summary.json"
          if [ ! -f "$payload_file" ]; then
            payload_file=$(mktemp)
            printf '{"status":"failure","message":"Shopify + Sellvia sync failed before summary generation"}' > "$payload_file"
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            --data @"$payload_file" \
            "$SYNC_FAILURE_WEBHOOK_URL"
